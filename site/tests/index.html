<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAWorld 集成测试</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: rgba(255, 255, 255, 0.9);
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(0, 0, 0, 0.12);
      --blue: #0071e3;
      --green: #16833a;
      --red: #d70015;
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Aptos", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button { font: inherit; }
    .shell {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1, h2 { margin: 0; letter-spacing: 0; }
    h1 { font-size: clamp(34px, 5vw, 58px); line-height: 1; }
    h2 { font-size: 20px; }
    p { color: var(--muted); line-height: 1.7; }

    .button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 16px;
      backdrop-filter: blur(18px);
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 34px;
      line-height: 1;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 900;
    }

    .status.passing { color: #fff; background: var(--green); border-color: var(--green); }
    .status.failing { color: #fff; background: var(--red); border-color: var(--red); }

    .details {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 14px;
    }

    .meta-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .meta-row {
      display: grid;
      gap: 4px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .meta-row span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .meta-row strong {
      word-break: break-word;
    }

    pre {
      min-height: 520px;
      max-height: 680px;
      overflow: auto;
      margin: 12px 0 0;
      padding: 14px;
      border: 1px solid #2b3230;
      border-radius: 8px;
      background: #101413;
      color: #dceee7;
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    @media (max-width: 820px) {
      .topbar, .details, .grid { grid-template-columns: 1fr; display: grid; }
      .topbar { align-items: stretch; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="kicker">GAWorld Integration</p>
        <h1>集成测试状态</h1>
        <p>展示服务器上长期运行测试循环的最新结果，方便大家在合并前后确认集成版本是否稳定。</p>
      </div>
      <button id="refreshBtn" class="button primary" type="button">刷新状态</button>
    </header>

    <section class="grid">
      <article class="panel metric">
        <p class="kicker">Status</p>
        <span id="statusBadge" class="status">读取中</span>
      </article>
      <article class="panel metric">
        <p class="kicker">Passed</p>
        <strong id="passedCount">-</strong>
      </article>
      <article class="panel metric">
        <p class="kicker">Skipped</p>
        <strong id="skippedCount">-</strong>
      </article>
      <article class="panel metric">
        <p class="kicker">Failed</p>
        <strong id="failedCount">-</strong>
      </article>
    </section>

    <section class="details">
      <aside class="panel">
        <p class="kicker">Latest Run</p>
        <h2 id="summaryLine">等待测试结果</h2>
        <div class="meta-list">
          <div class="meta-row">
            <span>更新时间</span>
            <strong id="updatedAt">-</strong>
          </div>
          <div class="meta-row">
            <span>测试分支</span>
            <strong id="branchName">tf</strong>
          </div>
          <div class="meta-row">
            <span>服务</span>
            <strong id="serviceName">gaworld-test-loop.service</strong>
          </div>
          <div class="meta-row">
            <span>日志文件</span>
            <strong id="logPath">-</strong>
          </div>
        </div>
      </aside>

      <section class="panel">
        <p class="kicker">Pytest Log</p>
        <h2>最新日志</h2>
        <pre id="logBox">正在读取...</pre>
      </section>
    </section>
  </main>

  <script>
    const els = {
      refreshBtn: document.getElementById("refreshBtn"),
      statusBadge: document.getElementById("statusBadge"),
      passedCount: document.getElementById("passedCount"),
      skippedCount: document.getElementById("skippedCount"),
      failedCount: document.getElementById("failedCount"),
      summaryLine: document.getElementById("summaryLine"),
      updatedAt: document.getElementById("updatedAt"),
      branchName: document.getElementById("branchName"),
      serviceName: document.getElementById("serviceName"),
      logPath: document.getElementById("logPath"),
      logBox: document.getElementById("logBox"),
    };

    function renderStatus(payload) {
      const summary = payload.summary || {};
      const status = summary.status || "unknown";
      els.statusBadge.textContent = status === "passing" ? "通过" : status === "failing" ? "失败" : "未知";
      els.statusBadge.className = `status ${status}`;
      els.passedCount.textContent = String(summary.passed ?? "-");
      els.skippedCount.textContent = String(summary.skipped ?? "-");
      els.failedCount.textContent = String(summary.failed ?? "-");
      els.summaryLine.textContent = summary.line || "还没有可解析的 pytest 汇总";
      els.updatedAt.textContent = payload.updated_at || "-";
      els.branchName.textContent = payload.branch || "tf";
      els.serviceName.textContent = payload.service || "gaworld-test-loop.service";
      els.logPath.textContent = payload.resolved_log_path || payload.log_path || "-";
      els.logBox.textContent = payload.log_tail || "暂无日志。";
    }

    async function loadStatus() {
      els.refreshBtn.disabled = true;
      try {
        const response = await fetch("/api/tests/status", { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok || payload.error) throw new Error(payload.error || `HTTP ${response.status}`);
        renderStatus(payload);
      } catch (error) {
        els.statusBadge.textContent = "读取失败";
        els.statusBadge.className = "status failing";
        els.logBox.textContent = error.message;
      } finally {
        els.refreshBtn.disabled = false;
      }
    }

    els.refreshBtn.addEventListener("click", loadStatus);
    loadStatus();
    setInterval(loadStatus, 60000);
  </script>
</body>
</html>
