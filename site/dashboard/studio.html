<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAWorld · Agent Studio</title>
  <meta name="description" content="GAWorld 智能体展示与编辑工作台" />
  <link rel="stylesheet" href="/site/dashboard/styles.css" />
  <link rel="stylesheet" href="/site/dashboard/studio.css?v=3" />
</head>
<body class="studio-body">
  <main class="studio-shell">
    <!-- Top bar -->
    <header class="studio-top">
      <div class="brand">
        <div class="brand-mark">GA</div>
        <div class="brand-copy">
          <p class="kicker">GAWorld Agent Studio</p>
          <h1>构建一个数字居民</h1>
          <p class="sub">设计具有状态、记忆、社交与目标的生成式城市居民智能体。</p>
        </div>
      </div>
      <div class="top-actions">
        <a class="button" href="/#dashboard" target="_top">← 返回控制台</a>
        <button id="newAgentBtn" class="button">＋ 新建</button>
        <button id="saveBtn" class="button primary">保存</button>
        <button id="runBtn" class="button steel">运行仿真</button>
      </div>
    </header>

    <!-- Step rail -->
    <nav class="step-rail" id="stepRail" aria-label="steps">
      <button class="step is-active" data-step="1"><span class="num">1</span>身份</button>
      <button class="step" data-step="2"><span class="num">2</span>状态 · 性格</button>
      <button class="step" data-step="3"><span class="num">3</span>能力 · 技能</button>
      <button class="step" data-step="4"><span class="num">4</span>记忆</button>
      <button class="step" data-step="5"><span class="num">5</span>社交 · 关系</button>
      <button class="step" data-step="6"><span class="num">6</span>行为 · 目标</button>
      <button class="step" data-step="7"><span class="num">7</span>复核 · 部署</button>
    </nav>

    <div class="studio-grid">
      <!-- Persistent subject rail -->
      <aside class="subject panel">
        <div class="subject-head">
          <label class="field">
            <span>选择居民</span>
            <select id="agentSelect"></select>
          </label>
        </div>
        <div class="avatar-wrap">
          <img id="subjectAvatar" class="subject-avatar" alt="" />
          <span class="idle-dot"><span></span>Idle</span>
        </div>
        <div class="subject-id">
          <strong id="subjectName">—</strong>
          <span id="subjectMeta" class="muted-line"></span>
        </div>
        <div class="mini-radar">
          <svg id="miniRadar" viewBox="0 0 200 200" aria-label="state radar"></svg>
        </div>
        <p class="autosave" id="saveHint">未加载</p>
      </aside>

      <!-- Step body -->
      <section class="stepbody panel" id="stepBody"></section>
    </div>

    <footer class="studio-foot">
      <span>Model <b>GAWorld Sim</b></span>
      <span>State <b>9 vars · [0,1]</b></span>
      <span>Seed <b id="footSeed">data/hangzhou_agents_state_init.csv</b></span>
      <span id="footMsg" class="foot-msg"></span>
    </footer>
  </main>
  <script src="/site/dashboard/studio.js?v=3"></script>
</body>
</html>
