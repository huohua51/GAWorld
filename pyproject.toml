[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaworld"
version = "0.2.0"
description = "Generative multi-agent simulator for urban social behavior experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GAWorld contributors" }]
license = { text = "Proprietary" }
keywords = ["simulation", "agents", "llm", "social", "policy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Runtime deps mirror requirements.txt; keep both in sync until pip-tools is adopted.
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "requests>=2.28,<3.0",
    "matplotlib>=3.6,<4.0",
    "networkx>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
gaworld = "generative_city_sim:_main"

[tool.setuptools]
# We are still mid-migration: keep the legacy flat layout discoverable, and
# ship the new gaworld/ subpackage too.
py-modules = [
    "config",
    "city_map_system",
    "custom_hooks",
    "dashboard_server",
    "distributed_comm",
    "distributed_comm_server",
    "economy_module",
    "environment",
    "experience_store",
    "extensibility",
    "external_environment_server",
    "generative_city_sim",
    "human_realism",
    "intervention_policy",
    "life_events",
    "llm_providers",
    "memory_store",
    "simulation_visualizer",
]

[tool.setuptools.packages.find]
include = ["gaworld*"]
exclude = ["backup*", "tests*", "output*", "tmp*", "video*", "site*"]

# ----------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    "backup",
    "output",
    "tmp",
    "video",
    "site",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes / pycodestyle
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "PIE",           # misc
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by black/ruff format
    "B008",   # function call in default argument is widely used
    "SIM105", # contextlib.suppress vs try/except pass — keep readable
    "RUF001", # ambiguous unicode chars (Chinese punctuation appears in strings)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"backup/*" = ["F", "E", "W", "B", "I", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 110
target-version = ["py311"]
extend-exclude = '''
/(
    backup
  | output
  | tmp
  | video
  | site
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
strict_optional = true
exclude = [
    "backup/",
    "output/",
    "tmp/",
    "video/",
    "site/",
]
# We enable strict typing only on the new gaworld/ tree first;
# legacy modules keep the looser default.
[[tool.mypy.overrides]]
module = "gaworld.*"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::DeprecationWarning:pandas.*",
]

[tool.coverage.run]
branch = true
source = ["gaworld"]
omit = [
    "tests/*",
    "backup/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
